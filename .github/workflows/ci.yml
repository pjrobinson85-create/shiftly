name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  server:
    name: Server build + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  server-tests:
    name: Server tests (vitest + supertest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations (fresh SQLite)
        run: npx prisma migrate deploy

      - name: Seed test data
        run: npm run db:seed

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-not-for-prod
  client:
    name: Client build + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  contrast-audit:
    name: WCAG contrast audit
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chrome for Testing
        run: |
          mkdir -p /opt/chrome
          npx @puppeteer/browsers install chrome@stable --path /opt/chrome
          CHROME_BIN="$(find /opt/chrome -type f -name chrome | head -1)"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Generate Prisma client
        run: npm run db:generate
        working-directory: server

      - name: Apply migrations (fresh SQLite)
        run: npx prisma migrate deploy
        working-directory: server

      - name: Seed test data
        run: npm run db:seed
        working-directory: server

      - name: Start API
        env:
          JWT_SECRET: ci-contrast-audit-secret
          PORT: "3000"
        run: |
          nohup npx tsx src/index.ts > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 1
          done
          echo "API failed to start:"; cat /tmp/api.log
          exit 1
        working-directory: server

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client

      - name: Start audit static server
        env:
          AUDIT_PORT: "5173"
          API_PORT: "3000"
        run: |
          nohup node audit/serve.mjs > /tmp/serve.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:5173/shiftly/; then exit 0; fi
            sleep 1
          done
          echo "static server failed:"; cat /tmp/serve.log
          exit 1

      - name: Start headless Chrome (CDP)
        run: |
          nohup "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu \
            --remote-debugging-port=9225 \
            --user-data-dir=/tmp/chrome-ci-profile > /tmp/chrome.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:9225/json/version; then exit 0; fi
            sleep 1
          done
          echo "chrome failed to start:"; cat /tmp/chrome.log
          exit 1

      - name: Run contrast audit
        run: |
          pip install websocket-client
          python3 audit/contrast_audit.py
        env:
          CDP_PORT: "9225"
          APP_BASE: "http://localhost:5173/shiftly"
          API_BASE: "http://localhost:3000"